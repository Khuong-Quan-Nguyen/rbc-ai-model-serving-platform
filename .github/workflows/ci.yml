name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install --no-cache-dir -r requirements-dev.txt
      - name: Lint with ruff
        run: ruff check app tests

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install --no-cache-dir -r requirements-dev.txt
      - name: Run tests with coverage
        run: pytest tests/ --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=80
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed — CI validation only)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: forecast-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy (placeholder)
        run: |
          echo "This is where a real pipeline would push the image to a"
          echo "registry (ECR/GCR/ACR) and apply the k8s/ manifests, e.g.:"
          echo "  kubectl apply -f k8s/ --namespace ai-model-serving"
          echo "Left as a manual/placeholder step since this repo has no"
          echo "live cluster or registry credentials configured."
